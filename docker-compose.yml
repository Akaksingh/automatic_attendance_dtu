services:
  db:
    image: pgvector/pgvector:pg16
    container_name: attendance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to host by default — DB stays internal to the compose network.
    # Uncomment to inspect locally:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attendance_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-attendance}
      REDIS_URL: redis://redis:6379/0
      INSIGHTFACE_HOME: /data/model_cache
    volumes:
      - photo_tmp:/data/photos          # transient raw photos (auto-purged)
      - model_cache:/data/model_cache   # downloaded model weights (persist)
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: attendance_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-attendance}
      REDIS_URL: redis://redis:6379/0
      INSIGHTFACE_HOME: /data/model_cache
    volumes:
      - photo_tmp:/data/photos
      - model_cache:/data/model_cache
    command: >
      celery -A app.worker.celery_app worker --loglevel=info --concurrency=2

  # Optional: Celery task monitor — start with: docker compose --profile monitoring up
  flower:
    image: mher/flower:2.0
    container_name: attendance_flower
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    command: celery flower --broker=redis://redis:6379/0

  # Optional: nginx TLS reverse-proxy — start with: docker compose --profile prod up
  # Provision certs first: ./scripts/setup_tls.sh (self-signed or letsencrypt).
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: attendance_nginx
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so renewed Let's Encrypt certs are picked up.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  # Optional: automatic Let's Encrypt renewal — start with: docker compose --profile prod up
  # Issuance is a one-time step done by scripts/setup_tls.sh; this container
  # only re-runs `certbot renew`, which replays the webroot + deploy-hook
  # settings recorded at issuance (copying fresh certs into nginx/certs/).
  certbot:
    image: certbot/certbot:latest
    container_name: attendance_certbot
    profiles: ["prod"]
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./nginx/certs:/certs
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

volumes:
  db_data:
  photo_tmp:
  model_cache:
  certbot_www:
  letsencrypt:
