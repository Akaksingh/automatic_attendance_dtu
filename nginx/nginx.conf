upstream api {
    server api:8000;
    keepalive 32;
}

# Rate-limit zone must be defined at http level (this file is included
# inside the http context via conf.d).
# Limit photo uploads to 2 per second per IP to prevent abuse.
limit_req_zone $binary_remote_addr zone=photo_upload:10m rate=2r/s;

# HTTP: serve ACME challenges (Let's Encrypt), redirect everything else to HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # ---- TLS ----
    # Certs live in nginx/certs/ — provision with scripts/setup_tls.sh:
    #   ./scripts/setup_tls.sh self-signed              (intranet deployments)
    #   ./scripts/setup_tls.sh letsencrypt <domain> <email>   (public hostname)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;

    # ---- Upload limit (group photos can be several MB) ----
    client_max_body_size 20M;

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # ---- Proxy to FastAPI ----
    location / {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
    }

    # Photo upload endpoint: tighter rate limit, longer timeout for big files.
    location ~ ^/sessions/[0-9]+/photo$ {
        limit_req zone=photo_upload burst=3 nodelay;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
